name: Kolkata Startup Map Automation
on:
  push:
    paths:
      - ".github/workflows/enrichment-now.trigger"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
    - cron: "23 15 * * *"
permissions:
  contents: read
jobs:
  check-jobs:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - name: Check official career pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets are not configured yet; skipping."
            exit 0
          fi
          python scripts/check_jobs.py

  check-ecosystem-news:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - name: Refresh verified ecosystem news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets are not configured yet; skipping."
            exit 0
          fi
          python scripts/check_news.py

  discover-company-candidates:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - name: Discover Kolkata companies from public ecosystem directories
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets are not configured yet; skipping."
            exit 0
          fi
          python scripts/discover_companies.py

  check-ecosystem-resources:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Check community, incubator, funding, jobs and ecosystem resources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets are not configured yet; skipping."
            exit 0
          fi
          python scripts/check_resources.py

  enrich-company-profiles:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - name: Enrich all approved startup profiles from public sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets are not configured yet; skipping."
            exit 0
          fi
          python scripts/enrich_company_profiles.py

  refresh-published-site:
    if: always() && (needs.check-jobs.result == 'success' || needs.check-ecosystem-news.result == 'success' || needs.discover-company-candidates.result == 'success' || needs.check-ecosystem-resources.result == 'success' || needs.enrich-company-profiles.result == 'success')
    needs: [check-jobs, check-ecosystem-news, discover-company-candidates, check-ecosystem-resources, enrich-company-profiles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record automation health
        env:
          JOBS_RESULT: \${{ needs.check-jobs.result }}
          NEWS_RESULT: \${{ needs.check-ecosystem-news.result }}
          DISCOVERY_RESULT: \${{ needs.discover-company-candidates.result }}
          RESOURCES_RESULT: \${{ needs.check-ecosystem-resources.result }}
          ENRICH_RESULT: \${{ needs.enrich-company-profiles.result }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          results = {
            "check-jobs": os.environ["JOBS_RESULT"],
            "check-ecosystem-news": os.environ["NEWS_RESULT"],
            "discover-company-candidates": os.environ["DISCOVERY_RESULT"],
            "check-ecosystem-resources": os.environ["RESOURCES_RESULT"],
            "enrich-company-profiles": os.environ["ENRICH_RESULT"]
          }
          overall = "healthy" if all(v == "success" for v in results.values()) else "degraded"
          payload = {
            "updatedAt": datetime.now(timezone.utc).isoformat(),
            "overall": overall,
            "jobs": results
          }
          with open("public/automation-health.json", "w") as f:
            json.dump(payload, f, indent=2)
          with open("public/data-refresh.txt", "w") as f:
            f.write("Last automated data refresh: " + payload["updatedAt"] + "\\n")
          PY
          git config user.name "Kolkata Startup Map Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data-refresh.txt public/automation-health.json
          git diff --cached --quiet || git commit -m "Record automation health"
          git push
