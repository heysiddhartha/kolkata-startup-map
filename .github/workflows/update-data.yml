name: Refresh Kolkata startup data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kolkata-startup-map-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public discovery data
        run: python scripts/update_data.py
      - name: Commit changes
        run: |
          git config user.name "Kolkata Startup Map Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/startups.json
          git diff --cached --quiet || git commit -m "Refresh Kolkata startup discovery data"
          git push
